<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="seattleu_2.ico?v=2">
    <title>Portfolio Admin - Duy Nguyen</title>
    <style>
        :root {
            --seattle-red: #AA0000;
            --seattle-red-dark: #880000;
            --seattle-white: #FFFFFF;
            --seattle-gray: #E5E5E5;
            --seattle-gray-light: #F8F9FA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            min-height: 100vh;
        }

        /* Header */
        .admin-header {
            background: linear-gradient(135deg, var(--seattle-red) 0%, var(--seattle-red-dark) 100%);
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .admin-header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .header-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        /* Login Screen */
        .login-container {
            min-height: calc(100vh - 60px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .login-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--seattle-red) 0%, var(--seattle-red-dark) 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }

        .login-card h2 {
            color: #333;
            margin-bottom: 8px;
        }

        .login-card p {
            color: #666;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #555;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--seattle-red);
            box-shadow: 0 0 0 3px rgba(170, 0, 0, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--seattle-red) 0%, var(--seattle-red-dark) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(170, 0, 0, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: var(--seattle-red);
        }

        /* Main Content */
        .admin-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .stat-icon.red { background: rgba(170, 0, 0, 0.1); }
        .stat-icon.blue { background: rgba(59, 130, 246, 0.1); }
        .stat-icon.green { background: rgba(34, 197, 94, 0.1); }
        .stat-icon.orange { background: rgba(249, 115, 22, 0.1); }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: #333;
        }

        .stat-label {
            font-size: 13px;
            color: #666;
        }

        /* Toolbar */
        .toolbar {
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            font-size: 13px;
            color: #666;
        }

        .filter-select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            background: white;
        }

        .toolbar-spacer {
            flex: 1;
        }

        .btn-add {
            background: linear-gradient(135deg, var(--seattle-red) 0%, var(--seattle-red-dark) 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-add:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(170, 0, 0, 0.3);
        }

        /* Entry Cards */
        .entries-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .entry-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: box-shadow 0.2s;
        }

        .entry-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        .entry-header {
            padding: 16px 20px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            cursor: pointer;
        }

        .entry-content {
            flex: 1;
            min-width: 0;
        }

        .entry-badges {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-category {
            background: rgba(170, 0, 0, 0.1);
            color: var(--seattle-red);
        }

        .badge-priority-high {
            background: rgba(239, 68, 68, 0.1);
            color: #DC2626;
        }

        .badge-priority-medium {
            background: rgba(245, 158, 11, 0.1);
            color: #D97706;
        }

        .badge-priority-low {
            background: rgba(107, 114, 128, 0.1);
            color: #6B7280;
        }

        .entry-preview {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .entry-tags {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 3px 8px;
            background: #f0f0f0;
            color: #666;
            border-radius: 4px;
            font-size: 11px;
        }

        .entry-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: transparent;
            font-size: 16px;
        }

        .btn-icon:hover {
            background: #f0f0f0;
        }

        .btn-icon.delete:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #DC2626;
        }

        .entry-expanded {
            padding: 0 20px 20px;
            border-top: 1px solid #eee;
            display: none;
        }

        .entry-card.expanded .entry-expanded {
            display: block;
        }

        .entry-full-content {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 16px;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            margin-top: 16px;
        }

        .entry-meta {
            font-size: 12px;
            color: #999;
            margin-top: 12px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(20px);
            transition: transform 0.2s;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            color: #333;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            padding: 4px;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-body {
            padding: 24px;
        }

        .modal-body .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        textarea.form-input {
            min-height: 200px;
            resize: vertical;
            font-family: inherit;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-secondary {
            padding: 10px 20px;
            background: #f0f0f0;
            color: #333;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        /* Test Query Panel */
        .test-query-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .test-query-section h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .test-input-row {
            display: flex;
            gap: 12px;
        }

        .test-input-row input {
            flex: 1;
        }

        .test-result {
            margin-top: 16px;
            padding: 16px;
            background: #f9f9f9;
            border-radius: 8px;
            display: none;
        }

        .test-result.active {
            display: block;
        }

        .test-answer {
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 12px;
        }

        .test-meta {
            font-size: 12px;
            color: #666;
            display: flex;
            gap: 16px;
        }

        .test-chunks {
            margin-top: 16px;
        }

        .test-chunks h4 {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .chunk-item {
            background: white;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .chunk-score {
            font-size: 11px;
            font-weight: 600;
            color: var(--seattle-red);
            margin-bottom: 4px;
        }

        .chunk-text {
            font-size: 12px;
            color: #555;
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            top: 80px;
            right: 24px;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            z-index: 1001;
            transform: translateX(120%);
            transition: transform 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.active {
            transform: translateX(0);
        }

        .toast.success {
            background: #ECFDF5;
            color: #065F46;
            border: 1px solid #A7F3D0;
        }

        .toast.error {
            background: #FEF2F2;
            color: #991B1B;
            border: 1px solid #FECACA;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: #666;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #eee;
            border-top-color: var(--seattle-red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .admin-header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar-spacer {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="admin-header">
        <h1>
            <span>&#128202;</span>
            Portfolio Admin
        </h1>
        <div class="header-actions" id="headerActions" style="display: none;">
            <button class="header-btn" onclick="openTestQuery()">
                <span>&#128300;</span> Test Query
            </button>
            <button class="header-btn" onclick="handleReseed()">
                <span>&#8635;</span> Reseed
            </button>
            <a href="index_portfolio.html" class="header-btn">
                <span>&#127968;</span> Portfolio
            </a>
        </div>
    </header>

    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <div class="login-card">
            <div class="login-icon">&#128274;</div>
            <h2>Portfolio Admin</h2>
            <p>Manage your knowledge base content</p>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="adminKey">Admin Key</label>
                    <input type="password" id="adminKey" class="form-input" placeholder="Enter admin key" required>
                </div>
                <div id="loginError" class="hidden" style="color: #DC2626; font-size: 13px; margin-bottom: 12px;"></div>
                <button type="submit" class="btn-primary" id="loginBtn">Login</button>
            </form>
            <a href="index_portfolio.html" class="back-link">
                <span>&#8592;</span> Back to Portfolio
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <main id="mainContent" class="admin-content hidden">
        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-icon red">&#128196;</div>
                <div>
                    <div class="stat-value" id="statEntries">-</div>
                    <div class="stat-label">Knowledge Entries</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue">&#128451;</div>
                <div>
                    <div class="stat-value" id="statChunks">-</div>
                    <div class="stat-label">Vector Chunks</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">&#127991;</div>
                <div>
                    <div class="stat-value" id="statTags">-</div>
                    <div class="stat-label">Tags Used</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">&#128193;</div>
                <div>
                    <div class="stat-value" id="statCategories">-</div>
                    <div class="stat-label">Categories</div>
                </div>
            </div>
        </div>

        <!-- Test Query Section -->
        <div class="test-query-section hidden" id="testQuerySection">
            <h3><span>&#128300;</span> Test RAG Query</h3>
            <div class="test-input-row">
                <input type="text" class="form-input" id="testQueryInput" placeholder="Enter a test query (e.g., 'What projects has Duy worked on?')">
                <button class="btn-primary" onclick="runTestQuery()" style="width: auto;">Test</button>
                <button class="btn-secondary" onclick="closeTestQuery()">Close</button>
            </div>
            <div class="test-result" id="testResult">
                <div class="test-answer" id="testAnswer"></div>
                <div class="test-meta">
                    <span id="testMeta"></span>
                </div>
                <div class="test-chunks" id="testChunks"></div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="filter-group">
                <label>Category:</label>
                <select class="filter-select" id="categoryFilter" onchange="loadEntries()">
                    <option value="">All</option>
                </select>
            </div>
            <div class="toolbar-spacer"></div>
            <button class="btn-add" onclick="openCreateModal()">
                <span>+</span> Add Entry
            </button>
        </div>

        <!-- Entries List -->
        <div class="entries-list" id="entriesList">
            <div class="loading">
                <div class="spinner"></div>
                Loading...
            </div>
        </div>
    </main>

    <!-- Create/Edit Modal -->
    <div class="modal-overlay" id="entryModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add Knowledge Entry</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form onsubmit="handleSaveEntry(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Content</label>
                        <textarea class="form-input" id="entryContent" required minlength="10" placeholder="Enter the knowledge content..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Category</label>
                            <select class="form-input" id="entryCategory">
                                <option value="about">About</option>
                                <option value="education">Education</option>
                                <option value="projects">Projects</option>
                                <option value="skills">Skills</option>
                                <option value="experience">Experience</option>
                                <option value="contact">Contact</option>
                                <option value="general" selected>General</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Priority</label>
                            <select class="form-input" id="entryPriority">
                                <option value="high">High</option>
                                <option value="medium" selected>Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Tags (comma-separated)</label>
                        <input type="text" class="form-input" id="entryTags" placeholder="e.g., project, python, machine-learning">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary" id="saveBtn" style="width: auto;">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // Configuration
        // Local: 'http://localhost:8000'
        // Production: 'https://second-brain-api-hptf.onrender.com'
        const API_URL = 'https://second-brain-api-hptf.onrender.com';
        let adminKey = '';
        let entries = [];
        let stats = null;
        let editingId = null;

        // API calls
        async function apiCall(endpoint, options = {}) {
            const res = await fetch(`${API_URL}${endpoint}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'X-Admin-Key': adminKey,
                    ...options.headers
                }
            });
            if (!res.ok) {
                const error = await res.json().catch(() => ({ detail: 'Request failed' }));
                throw new Error(error.detail || 'Request failed');
            }
            if (res.status === 204) return null;
            return res.json();
        }

        // Toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} active`;
            setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // Login
        async function handleLogin(e) {
            e.preventDefault();
            const keyInput = document.getElementById('adminKey');
            adminKey = keyInput.value;

            document.getElementById('loginBtn').disabled = true;
            document.getElementById('loginBtn').textContent = 'Loading...';

            try {
                stats = await apiCall('/api/v1/admin/stats');
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                document.getElementById('headerActions').style.display = 'flex';
                updateStats();
                loadEntries();
            } catch (err) {
                document.getElementById('loginError').textContent = 'Invalid admin key';
                document.getElementById('loginError').classList.remove('hidden');
                adminKey = '';
            } finally {
                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loginBtn').textContent = 'Login';
            }
        }

        // Update stats display
        function updateStats() {
            document.getElementById('statEntries').textContent = stats.total_entries;
            document.getElementById('statChunks').textContent = stats.total_chunks;
            document.getElementById('statTags').textContent = stats.tags_used.length;
            document.getElementById('statCategories').textContent = Object.keys(stats.categories).length;

            // Update category filter
            const filter = document.getElementById('categoryFilter');
            filter.innerHTML = '<option value="">All</option>';
            Object.entries(stats.categories).forEach(([cat, count]) => {
                filter.innerHTML += `<option value="${cat}">${cat} (${count})</option>`;
            });
        }

        // Load entries
        async function loadEntries() {
            const category = document.getElementById('categoryFilter').value;
            const list = document.getElementById('entriesList');
            list.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';

            try {
                const url = category ? `/api/v1/admin/knowledge?category=${category}&limit=100` : '/api/v1/admin/knowledge?limit=100';
                const data = await apiCall(url);
                entries = data.entries;
                renderEntries();
            } catch (err) {
                list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">&#9888;</div><p>Failed to load entries</p></div>`;
            }
        }

        // Render entries
        function renderEntries() {
            const list = document.getElementById('entriesList');

            if (entries.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">&#128451;</div>
                        <p>No knowledge entries found</p>
                        <button class="btn-add" onclick="openCreateModal()" style="margin-top: 16px;">Add your first entry</button>
                    </div>
                `;
                return;
            }

            list.innerHTML = entries.map(entry => `
                <div class="entry-card" id="entry-${entry.id}">
                    <div class="entry-header" onclick="toggleEntry('${entry.id}')">
                        <div class="entry-content">
                            <div class="entry-badges">
                                ${entry.category ? `<span class="badge badge-category">${entry.category}</span>` : ''}
                                ${entry.priority ? `<span class="badge badge-priority-${entry.priority}">${entry.priority}</span>` : ''}
                            </div>
                            <div class="entry-preview">${escapeHtml(entry.content.substring(0, 150))}...</div>
                            <div class="entry-tags">
                                ${entry.tags.slice(0, 5).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                                ${entry.tags.length > 5 ? `<span class="tag">+${entry.tags.length - 5} more</span>` : ''}
                            </div>
                        </div>
                        <div class="entry-actions">
                            <button class="btn-icon" onclick="event.stopPropagation(); openEditModal('${entry.id}')" title="Edit">&#9998;</button>
                            <button class="btn-icon delete" onclick="event.stopPropagation(); deleteEntry('${entry.id}')" title="Delete">&#128465;</button>
                            <span style="color: #ccc;">&#9662;</span>
                        </div>
                    </div>
                    <div class="entry-expanded">
                        <div class="entry-full-content">${escapeHtml(entry.content)}</div>
                        <div class="entry-meta">
                            Created: ${new Date(entry.created_at).toLocaleString()}
                            ${entry.updated_at ? ` | Updated: ${new Date(entry.updated_at).toLocaleString()}` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function toggleEntry(id) {
            const card = document.getElementById(`entry-${id}`);
            card.classList.toggle('expanded');
        }

        // Modal
        function openCreateModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Add Knowledge Entry';
            document.getElementById('entryContent').value = '';
            document.getElementById('entryCategory').value = 'general';
            document.getElementById('entryPriority').value = 'medium';
            document.getElementById('entryTags').value = '';
            document.getElementById('entryModal').classList.add('active');
        }

        function openEditModal(id) {
            const entry = entries.find(e => e.id === id);
            if (!entry) return;

            editingId = id;
            document.getElementById('modalTitle').textContent = 'Edit Knowledge Entry';
            document.getElementById('entryContent').value = entry.content;
            document.getElementById('entryCategory').value = entry.category || 'general';
            document.getElementById('entryPriority').value = entry.priority || 'medium';
            document.getElementById('entryTags').value = entry.tags.join(', ');
            document.getElementById('entryModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('entryModal').classList.remove('active');
            editingId = null;
        }

        async function handleSaveEntry(e) {
            e.preventDefault();

            const data = {
                content: document.getElementById('entryContent').value,
                category: document.getElementById('entryCategory').value,
                priority: document.getElementById('entryPriority').value,
                tags: document.getElementById('entryTags').value.split(',').map(t => t.trim()).filter(Boolean),
                source: 'portfolio'
            };

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                if (editingId) {
                    await apiCall(`/api/v1/admin/knowledge/${editingId}`, {
                        method: 'PUT',
                        body: JSON.stringify(data)
                    });
                    showToast('Entry updated successfully');
                } else {
                    await apiCall('/api/v1/admin/knowledge', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });
                    showToast('Entry created successfully');
                }

                closeModal();
                stats = await apiCall('/api/v1/admin/stats');
                updateStats();
                loadEntries();
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save';
            }
        }

        async function deleteEntry(id) {
            if (!confirm('Are you sure you want to delete this entry?')) return;

            try {
                await apiCall(`/api/v1/admin/knowledge/${id}`, { method: 'DELETE' });
                showToast('Entry deleted successfully');
                stats = await apiCall('/api/v1/admin/stats');
                updateStats();
                loadEntries();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // Test Query
        function openTestQuery() {
            document.getElementById('testQuerySection').classList.remove('hidden');
            document.getElementById('testQueryInput').focus();
        }

        function closeTestQuery() {
            document.getElementById('testQuerySection').classList.add('hidden');
            document.getElementById('testResult').classList.remove('active');
        }

        async function runTestQuery() {
            const query = document.getElementById('testQueryInput').value.trim();
            if (!query) return;

            document.getElementById('testResult').classList.remove('active');

            try {
                const result = await apiCall('/api/v1/admin/test-query', {
                    method: 'POST',
                    body: JSON.stringify({ query })
                });

                document.getElementById('testAnswer').textContent = result.answer;
                document.getElementById('testMeta').textContent = `${result.retrieved_count} chunks retrieved | ${result.duration_ms.toFixed(0)}ms`;

                const chunksHtml = result.top_chunks.map(chunk => `
                    <div class="chunk-item">
                        <div class="chunk-score">${(chunk.score * 100).toFixed(0)}% match</div>
                        <div class="chunk-text">${escapeHtml(chunk.content)}</div>
                    </div>
                `).join('');

                document.getElementById('testChunks').innerHTML = `<h4>Retrieved Chunks:</h4>${chunksHtml}`;
                document.getElementById('testResult').classList.add('active');
            } catch (err) {
                showToast('Failed to run test query', 'error');
            }
        }

        // Reseed
        async function handleReseed() {
            if (!confirm('This will clear all entries and reseed from seed_data.py. Continue?')) return;

            try {
                const result = await apiCall('/api/v1/admin/reseed', { method: 'POST' });
                showToast(`Reseeded: ${result.entries_created} entries created`);
                stats = await apiCall('/api/v1/admin/stats');
                updateStats();
                loadEntries();
            } catch (err) {
                showToast('Failed to reseed', 'error');
            }
        }

        // Handle Enter key in test query input
        document.getElementById('testQueryInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') runTestQuery();
        });
    </script>
</body>
</html>
